name: attest

# Chaîne Git/CI/attestation de démonstration (dépôt de test isolé, jamais la production).
# Déclenchée par un push sur une branche auto/* ou test/* (la chaîne de publication).
# Gates déterministes => artifacts => attestation Sigstore (OIDC GitHub).

on:
  push:
    branches:
      - 'auto/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gates puis attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'

      - name: Gates déterministes (BLOCK => échec, aucune attestation)
        run: node ci/gate.mjs

      - name: Stage des artifacts de publication
        run: |
          mkdir -p release
          cp article.md release/article.md
          cp evidence/gate-report.json release/gate-report.json
          # Marqueur de secret lu depuis le secret store, jamais affiché (empreinte seule).
          MARKER=$(printf '%s' "${{ secrets.ATTEST_TEST_SECRET }}" | sha256sum | cut -d' ' -f1)
          {
            echo '{'
            echo "  \"commit\": \"${GITHUB_SHA}\","
            echo "  \"branch\": \"${GITHUB_REF_NAME}\","
            echo "  \"secretMarkerSha256\": \"${MARKER}\""
            echo '}'
          } > release/manifest.json

      - name: Attestation Sigstore (provenance de build OIDC)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/article.md
            release/gate-report.json

      - name: Conserver l'artifact attesté
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-release-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7
